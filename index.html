<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no"
>

<title>Panorama Viewer</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;

    background: #000;

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    touch-action: none;
}


/* =========================================================
   ЭКРАН ВЫБОРА
========================================================= */

#startScreen {

    position: fixed;

    inset: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle at center,
            #202020 0%,
            #090909 55%,
            #000000 100%
        );

    z-index: 100;
}


.startBox {

    width: min(
        520px,
        calc(100% - 30px)
    );

    padding: 32px;

    border-radius: 20px;

    background: rgba(
        25,
        25,
        25,
        .95
    );

    border: 1px solid
        rgba(255,255,255,.12);

    text-align: center;

    box-shadow:
        0 25px 80px
        rgba(0,0,0,.65);

}


.logo {

    font-size: 46px;

    margin-bottom: 8px;

}


h1 {

    margin: 0 0 10px;

    font-size: 28px;

}


.startDescription {

    color: #aaa;

    line-height: 1.5;

    margin:
        0 0 25px;

}


#fileInput {

    display: none;

}


.chooseButton {

    display: inline-flex;

    align-items: center;
    justify-content: center;

    min-height: 52px;

    padding:
        0 25px;

    border-radius: 13px;

    background: white;

    color: black;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    transition:
        transform .15s,
        opacity .15s;

}


.chooseButton:hover {

    opacity: .9;

}


.chooseButton:active {

    transform:
        scale(.96);

}


.note {

    margin-top: 16px;

    color: #777;

    font-size: 12px;

}


/* =========================================================
   ПРОСМОТРЩИК
========================================================= */

#viewer {

    position: fixed;

    inset: 0;

    display: none;

    overflow: hidden;

    background: #000;

    cursor: grab;

}


#viewer.dragging {

    cursor: grabbing;

}


/*
    ВАЖНО:

    Картинка НЕ растягивается на экран.

    width/height задаются JavaScript
    с сохранением оригинального
    соотношения сторон.
*/

#image {

    position: absolute;

    left: 0;
    top: 0;

    max-width: none;
    max-height: none;

    user-select: none;

    -webkit-user-drag: none;

    pointer-events: none;

    transform-origin:
        center center;

}


/* =========================================================
   ИНТЕРФЕЙС
========================================================= */

#ui {

    position: fixed;

    inset: 0;

    display: none;

    pointer-events: none;

    z-index: 20;

}


.topBar {

    position: absolute;

    top: 15px;

    left: 15px;
    right: 15px;

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    gap: 10px;

}


.fileName {

    max-width: 60%;

    padding:
        10px 14px;

    border-radius: 12px;

    background:
        rgba(0,0,0,.58);

    backdrop-filter:
        blur(12px);

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;

    font-size: 14px;

}


.buttons {

    display: flex;

    gap: 7px;

    pointer-events:
        auto;

}


button {

    width: 44px;
    height: 44px;

    border:
        1px solid
        rgba(255,255,255,.15);

    border-radius: 12px;

    background:
        rgba(0,0,0,.58);

    backdrop-filter:
        blur(12px);

    color: white;

    font-size: 18px;

    cursor: pointer;

}


button:hover {

    background:
        rgba(255,255,255,.15);

}


button:active {

    transform:
        scale(.94);

}


/* =========================================================
   НИЖНЯЯ ПАНЕЛЬ
========================================================= */

.bottomBar {

    position: absolute;

    left: 50%;

    bottom: 18px;

    transform:
        translateX(-50%);

    display: flex;

    align-items: center;

    gap: 8px;

    padding: 8px;

    border-radius: 15px;

    background:
        rgba(0,0,0,.58);

    backdrop-filter:
        blur(12px);

    pointer-events:
        auto;

}


.counter {

    min-width: 65px;

    text-align: center;

    font-size: 13px;

    color: #ddd;

}


/* =========================================================
   ПОДСКАЗКА
========================================================= */

#hint {

    position: fixed;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    padding:
        18px 24px;

    border-radius: 14px;

    background:
        rgba(0,0,0,.72);

    backdrop-filter:
        blur(12px);

    text-align: center;

    line-height: 1.5;

    pointer-events: none;

    opacity: 0;

    transition:
        opacity .3s;

    z-index: 30;

}


#hint.show {

    opacity: 1;

}


/* =========================================================
   МОБИЛЬНЫЕ
========================================================= */

@media (max-width: 600px) {

    .startBox {

        padding:
            25px 20px;

    }


    .logo {

        font-size: 38px;

    }


    h1 {

        font-size: 24px;

    }


    .topBar {

        top: 9px;

        left: 9px;
        right: 9px;

    }


    button {

        width: 40px;
        height: 40px;

    }


    .bottomBar {

        bottom: 10px;

    }

}

</style>
</head>


<body>


<!-- =======================================================
     ЭКРАН ВЫБОРА
======================================================= -->

<div id="startScreen">

    <div class="startBox">

        <div class="logo">
            🖼️
        </div>

        <h1>
            Panorama Viewer
        </h1>

        <div class="startDescription">

            Выбери одну или несколько
            фотографий с устройства.

            <br>

            Они останутся только
            в твоём браузере.

        </div>


        <label
            class="chooseButton"
            for="fileInput"
        >

            Выбрать фотографии

        </label>


        <input
            id="fileInput"
            type="file"
            accept="image/jpeg,image/png,image/webp"
            multiple
        >


        <div class="note">

            Ничего не загружается
            на GitHub или сервер.

        </div>

    </div>

</div>



<!-- =======================================================
     VIEWER
======================================================= -->

<div id="viewer">

    <img
        id="image"
        draggable="false"
        alt=""
    >

</div>



<!-- =======================================================
     UI
======================================================= -->

<div id="ui">


    <div class="topBar">

        <div
            class="fileName"
            id="fileName"
        >
            -
        </div>


        <div class="buttons">

            <button
                id="changeButton"
                title="Выбрать фотографии"
            >
                📂
            </button>


            <button
                id="resetButton"
                title="Сбросить положение"
            >
                ⟳
            </button>


            <button
                id="fullscreenButton"
                title="Полный экран"
            >
                ⛶
            </button>

        </div>

    </div>



    <div class="bottomBar">

        <button
            id="previousButton"
        >
            ←
        </button>


        <div
            class="counter"
            id="counter"
        >
            0 / 0
        </div>


        <button
            id="nextButton"
        >
            →
        </button>

    </div>

</div>



<div id="hint">

    🖱️ Перетаскивай изображение<br>
    🔍 Колесо — масштаб<br>
    📱 На телефоне — один палец<br>
    👆 Два пальца — масштаб

</div>



<script>

/* =========================================================
   ЭЛЕМЕНТЫ
========================================================= */

const fileInput =
    document.getElementById(
        "fileInput"
    );

const startScreen =
    document.getElementById(
        "startScreen"
    );

const viewer =
    document.getElementById(
        "viewer"
    );

const image =
    document.getElementById(
        "image"
    );

const ui =
    document.getElementById(
        "ui"
    );

const fileName =
    document.getElementById(
        "fileName"
    );

const counter =
    document.getElementById(
        "counter"
    );



/* =========================================================
   СОСТОЯНИЕ
========================================================= */

let files = [];

let currentIndex = 0;


/*
    Масштаб.

    1 = картинка вписана в экран.

    2 = в два раза больше.

    и т.д.
*/

let scale = 1;


/*
    Положение картинки.
*/

let x = 0;
let y = 0;


/*
    Начальные координаты
    перетаскивания.
*/

let startX = 0;
let startY = 0;


/*
    Положение картинки
    в момент начала drag.
*/

let startImageX = 0;
let startImageY = 0;


let dragging = false;


/*
    Для pinch zoom.
*/

let pinchDistance = null;


/*
    Размер изображения
    после вписывания.
*/

let baseWidth = 0;
let baseHeight = 0;


/* =========================================================
   ВЫБОР ФАЙЛОВ
========================================================= */

fileInput.addEventListener(
    "change",
    () => {

        const selected =
            Array.from(
                fileInput.files
            );


        if (!selected.length)
            return;


        /*
            Оставляем только картинки.
        */

        files =
            selected.filter(
                file =>
                    file.type
                        .startsWith(
                            "image/"
                        )
            );


        if (!files.length)
            return;


        currentIndex = 0;


        startScreen.style.display =
            "none";

        viewer.style.display =
            "block";

        ui.style.display =
            "block";


        showImage(
            currentIndex
        );


        showHint();

    }
);


/* =========================================================
   ПОКАЗ КАРТИНКИ
========================================================= */

function showImage(index) {

    if (!files.length)
        return;


    currentIndex =
        (
            index +
            files.length
        ) %
        files.length;


    const file =
        files[currentIndex];


    const url =
        URL.createObjectURL(
            file
        );


    image.onload =
        () => {

            /*
                Рассчитываем размер,
                при котором картинка
                ЦЕЛИКОМ помещается
                в окно.

                Никакого растягивания.
            */

            const screenWidth =
                window.innerWidth;

            const screenHeight =
                window.innerHeight;


            const imageRatio =
                image.naturalWidth /
                image.naturalHeight;


            const screenRatio =
                screenWidth /
                screenHeight;


            if (
                imageRatio >
                screenRatio
            ) {

                /*
                    Картинка шире экрана.

                    Подгоняем по ширине.
                */

                baseWidth =
                    screenWidth;

                baseHeight =
                    screenWidth /
                    imageRatio;

            } else {

                /*
                    Картинка выше экрана.

                    Подгоняем по высоте.
                */

                baseHeight =
                    screenHeight;

                baseWidth =
                    screenHeight *
                    imageRatio;

            }


            /*
                Начальное положение —
                строго центр.
            */

            scale = 1;

            x =
                (
                    screenWidth -
                    baseWidth
                ) / 2;


            y =
                (
                    screenHeight -
                    baseHeight
                ) / 2;


            updateImage();


            fileName.textContent =
                file.name;


            counter.textContent =
                `${currentIndex + 1} / ${files.length}`;

        };


    image.src = url;

}


/* =========================================================
   ОБНОВЛЕНИЕ ПОЗИЦИИ
========================================================= */

function updateImage() {

    const width =
        baseWidth * scale;

    const height =
        baseHeight * scale;


    image.style.width =
        `${width}px`;


    image.style.height =
        `${height}px`;


    image.style.left =
        `${x}px`;


    image.style.top =
        `${y}px`;

}


/* =========================================================
   ПЕРЕТАСКИВАНИЕ МЫШЬЮ
========================================================= */

viewer.addEventListener(
    "pointerdown",
    event => {

        /*
            Не начинаем drag,
            если нажали кнопку UI.
        */

        if (
            event.target !==
            viewer &&
            event.target !==
            image
        )
            return;


        dragging = true;


        viewer.classList.add(
            "dragging"
        );


        startX =
            event.clientX;


        startY =
            event.clientY;


        startImageX =
            x;


        startImageY =
            y;


        viewer.setPointerCapture(
            event.pointerId
        );

    }
);


viewer.addEventListener(
    "pointermove",
    event => {

        if (!dragging)
            return;


        x =
            startImageX +
            (
                event.clientX -
                startX
            );


        y =
            startImageY +
            (
                event.clientY -
                startY
            );


        updateImage();

    }
);


viewer.addEventListener(
    "pointerup",
    () => {

        dragging = false;

        viewer.classList.remove(
            "dragging"
        );

    }
);


viewer.addEventListener(
    "pointercancel",
    () => {

        dragging = false;

        viewer.classList.remove(
            "dragging"
        );

    }
);


/* =========================================================
   ZOOM МЫШЬЮ
========================================================= */

viewer.addEventListener(
    "wheel",
    event => {

        event.preventDefault();


        const oldScale =
            scale;


        /*
            Чем меньше deltaY,
            тем плавнее zoom.
        */

        const zoom =
            Math.exp(
                -event.deltaY * 0.001
            );


        scale *= zoom;


        scale =
            Math.max(
                0.1,
                Math.min(
                    8,
                    scale
                )
            );


        /*
            Масштабируем относительно
            точки, где находится мышь.

            Поэтому картинка не
            прыгает в сторону.
        */

        const rect =
            viewer.getBoundingClientRect();


        const mouseX =
            event.clientX -
            rect.left;


        const mouseY =
            event.clientY -
            rect.top;


        const ratio =
            scale /
            oldScale;


        x =
            mouseX -
            (
                mouseX -
                x
            ) *
            ratio;


        y =
            mouseY -
            (
                mouseY -
                y
            ) *
            ratio;


        updateImage();

    },
    {
        passive: false
    }
);


/* =========================================================
   TOUCH
========================================================= */

viewer.addEventListener(
    "touchstart",
    event => {

        if (
            event.touches.length === 1
        ) {

            dragging = true;


            startX =
                event.touches[0]
                    .clientX;


            startY =
                event.touches[0]
                    .clientY;


            startImageX = x;
            startImageY = y;

        }


        if (
            event.touches.length === 2
        ) {

            dragging = false;


            pinchDistance =
                getDistance(
                    event.touches
                );

        }

    },
    {
        passive: false
    }
);


viewer.addEventListener(
    "touchmove",
    event => {

        event.preventDefault();


        /*
            Один палец —
            перемещение.
        */

        if (
            event.touches.length === 1 &&
            dragging
        ) {

            const currentX =
                event.touches[0]
                    .clientX;


            const currentY =
                event.touches[0]
                    .clientY;


            x =
                startImageX +
                (
                    currentX -
                    startX
                );


            y =
                startImageY +
                (
                    currentY -
                    startY
                );


            updateImage();

        }


        /*
            Два пальца —
            масштаб.
        */

        if (
            event.touches.length === 2
        ) {

            const newDistance =
                getDistance(
                    event.touches
                );


            if (
                pinchDistance !== null
            ) {

                const ratio =
                    newDistance /
                    pinchDistance;


                scale *= ratio;


                scale =
                    Math.max(
                        .1,
                        Math.min(
                            8,
                            scale
                        )
                    );


                updateImage();

            }


            pinchDistance =
                newDistance;

        }

    },
    {
        passive: false
    }
);


viewer.addEventListener(
    "touchend",
    event => {

        if (
            event.touches.length === 0
        ) {

            dragging = false;

        }


        if (
            event.touches.length < 2
        ) {

            pinchDistance = null;

        }

    }
);


function getDistance(touches) {

    const dx =
        touches[0].clientX -
        touches[1].clientX;


    const dy =
        touches[0].clientY -
        touches[1].clientY;


    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}


/* =========================================================
   КНОПКИ
========================================================= */

document
    .getElementById(
        "nextButton"
    )
    .onclick =
        () => {

            showImage(
                currentIndex + 1
            );

        };


document
    .getElementById(
        "previousButton"
    )
    .onclick =
        () => {

            showImage(
                currentIndex - 1
            );

        };


document
    .getElementById(
        "changeButton"
    )
    .onclick =
        () => {

            fileInput.click();

        };


/* =========================================================
   RESET
========================================================= */

document
    .getElementById(
        "resetButton"
    )
    .onclick =
        () => {

            if (!files.length)
                return;


            scale = 1;


            x =
                (
                    window.innerWidth -
                    baseWidth
                ) / 2;


            y =
                (
                    window.innerHeight -
                    baseHeight
                ) / 2;


            updateImage();

        };


/* =========================================================
   FULLSCREEN
========================================================= */

document
    .getElementById(
        "fullscreenButton"
    )
    .onclick =
        async () => {

            try {

                if (
                    !document.fullscreenElement
                ) {

                    await document
                        .documentElement
                        .requestFullscreen();

                } else {

                    await document
                        .exitFullscreen();

                }

            } catch {}

        };


/* =========================================================
   КЛАВИАТУРА
========================================================= */

window.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "ArrowRight"
        ) {

            showImage(
                currentIndex + 1
            );

        }


        if (
            event.key ===
            "ArrowLeft"
        ) {

            showImage(
                currentIndex - 1
            );

        }


        if (
            event.key ===
            "0"
        ) {

            document
                .getElementById(
                    "resetButton"
                )
                .click();

        }


        if (
            event.key ===
            "f"
        ) {

            document
                .getElementById(
                    "fullscreenButton"
                )
                .click();

        }

    }
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        if (!files.length)
            return;


        /*
            При изменении экрана
            заново вписываем текущую
            картинку целиком.
        */

        const oldScale =
            scale;


        scale = 1;


        const imageRatio =
            image.naturalWidth /
            image.naturalHeight;


        const screenRatio =
            window.innerWidth /
            window.innerHeight;


        if (
            imageRatio >
            screenRatio
        ) {

            baseWidth =
                window.innerWidth;

            baseHeight =
                window.innerWidth /
                imageRatio;

        } else {

            baseHeight =
                window.innerHeight;

            baseWidth =
                window.innerHeight *
                imageRatio;

        }


        x =
            (
                window.innerWidth -
                baseWidth
            ) / 2;


        y =
            (
                window.innerHeight -
                baseHeight
            ) / 2;


        updateImage();

    }
);


/* =========================================================
   ПОДСКАЗКА
========================================================= */

function showHint() {

    const hint =
        document.getElementById(
            "hint"
        );


    hint.classList.add(
        "show"
    );


    setTimeout(
        () => {

            hint.classList.remove(
                "show"
            );

        },
        3500
    );

}

</script>

</body>
</html>
